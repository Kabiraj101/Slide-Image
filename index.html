<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Slider Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <h1>Image Slider Library</h1>

    <!-- Arrows, dots and the "Image X of Y" badge are generated by slider.js -->
    <section class="slider" data-slider aria-label="Photo gallery">
      <div class="slider__track">
        <figure class="slider__slide">
          <img src="images/slide-1.jpg" alt="Describe your first photo here">
        </figure>
        <figure class="slider__slide">
          <img src="images/slide-2.jpg" alt="Describe your second photo here">
        </figure>
        <figure class="slider__slide">
          <img src="images/slide-3.jpg" alt="Describe your third photo here">
        </figure>
        <figure class="slider__slide">
          <img src="images/slide-4.jpg" alt="Describe your fourth photo here">
        </figure>
      </div>
    </section>
  </main>

  <script src="slider.js"></script>
</body>
</html>
